services:
  # The Backend API (FastAPI)
  - type: web
    name: chatterbook-backend
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # The Frontend UI (Flask)
  - type: web
    name: chatterbook-frontend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn frontend_app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: BACKEND_URL
        fromService:
          type: web
          name: chatterbook-backend
          envVarKey: RENDER_EXTERNAL_URL
