#version: '3.8' # Use a standard version

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatterbook_backend
    command: uvicorn backend_app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # This mounts everything including source_documents
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s