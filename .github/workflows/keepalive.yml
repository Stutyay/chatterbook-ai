name: SnapDeploy Keep-Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" -H "Accept: text/html,application/xhtml+xml" -s -o /dev/null -w "Backend status: %{http_code}\n" https://chatterbook-backend-c1c63.containers.snapdeploy.app || true

      - name: Ping frontend
        run: |
          curl -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" -H "Accept: text/html,application/xhtml+xml" -s -o /dev/null -w "Frontend status: %{http_code}\n" https://chatterbook-frontend-c1c63.containers.snapdeploy.app || true
